<h2>三分屏布局 · 竖排按钮 + 无底栏</h2>
<p class="subtitle">按钮移至右侧竖列，节省垂直空间</p>

<div style="max-width: 720px; margin: 0 auto;">
  <div style="border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; font-size: 11px; box-shadow: 0 4px 24px rgba(0,0,0,0.08);">

    <!-- Top bar -->
    <div style="background: #ffffff; padding: 7px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 22px; height: 22px; background: #6366f1; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: white; font-weight: bold;">S</div>
        <span style="color: #1e293b; font-size: 11px; font-weight: 600;">SAT Math · Quadratic Functions</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <div style="width: 7px; height: 7px; background: #ef4444; border-radius: 50%;"></div>
        <span style="color: #ef4444; font-size: 9px; font-weight: 700; letter-spacing: 1px;">LIVE</span>
        <span style="color: #94a3b8; font-size: 9px; margin-left: 4px;">128 watching</span>
      </div>
    </div>

    <!-- Main layout: lecture 70% | avatars 24% | buttons 6% -->
    <div style="display: flex; height: 380px; background: #f8fafc;">

      <!-- LEFT: Lecture notes 70% -->
      <div style="width: 70%; border-right: 1px solid #e2e8f0; background: #ffffff; display: flex; flex-direction: column;">
        <div style="flex: 1; margin: 14px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);">

          <div style="color: #0f172a; font-size: 14px; font-weight: 700; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
            <span>Vertex Form of a Quadratic</span>
            <span style="color: #cbd5e1; font-size: 9px; font-weight: 400;">3 / 12</span>
          </div>

          <div style="background: #f0f0ff; border-left: 3px solid #6366f1; padding: 10px 14px; border-radius: 0 6px 6px 0;">
            <div style="color: #4338ca; font-size: 16px; font-family: 'Georgia', serif; text-align: center; letter-spacing: 2px;">
              f(x) = a(x − h)² + k
            </div>
          </div>

          <div style="flex: 1; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; display: flex; align-items: center; justify-content: center; padding: 10px;">
            <svg width="240" height="140" viewBox="0 0 240 155">
              <line x1="20" y1="120" x2="220" y2="120" stroke="#e2e8f0" stroke-width="1"/>
              <line x1="120" y1="10" x2="120" y2="130" stroke="#e2e8f0" stroke-width="1"/>
              <line x1="70" y1="117" x2="70" y2="123" stroke="#cbd5e1" stroke-width="1"/>
              <line x1="170" y1="117" x2="170" y2="123" stroke="#cbd5e1" stroke-width="1"/>
              <path d="M 35 112 Q 120 18 205 112" stroke="#6366f1" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <line x1="120" y1="18" x2="120" y2="120" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
              <circle cx="120" cy="18" r="5" fill="#f59e0b"/>
              <rect x="128" y="10" width="32" height="14" rx="2" fill="#fffbeb" opacity="0.9"/>
              <text x="132" y="20" fill="#b45309" font-size="9" font-family="monospace">vertex</text>
              <text x="224" y="124" fill="#94a3b8" font-size="9" font-family="monospace">x</text>
              <text x="123" y="8" fill="#94a3b8" font-size="9" font-family="monospace">y</text>
            </svg>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
            <div style="background: #fffbeb; border-radius: 5px; padding: 7px 9px; border: 1px solid #fde68a;">
              <div style="color: #b45309; font-size: 9px; font-weight: 700; margin-bottom: 2px;">Vertex (h, k)</div>
              <div style="color: #78716c; font-size: 9px; line-height: 1.3;">Min/max point</div>
            </div>
            <div style="background: #eef2ff; border-radius: 5px; padding: 7px 9px; border: 1px solid #c7d2fe;">
              <div style="color: #4338ca; font-size: 9px; font-weight: 700; margin-bottom: 2px;">a &gt; 0 opens ↑</div>
              <div style="color: #78716c; font-size: 9px; line-height: 1.3;">a &lt; 0 opens ↓</div>
            </div>
            <div style="background: #f0fdf4; border-radius: 5px; padding: 7px 9px; border: 1px solid #bbf7d0;">
              <div style="color: #15803d; font-size: 9px; font-weight: 700; margin-bottom: 2px;">SAT tip ★</div>
              <div style="color: #78716c; font-size: 9px; line-height: 1.3;">Read vertex directly</div>
            </div>
          </div>

        </div>
      </div>

      <!-- MIDDLE: Avatar column 24% -->
      <div style="width: 24%; display: flex; flex-direction: column; border-right: 1px solid #e2e8f0;">

        <!-- Instructor 50% -->
        <div style="height: 50%; border-bottom: 1px solid #e2e8f0; background: #f1f5f9; position: relative; overflow: hidden; display: flex; flex-direction: column;">
          <div style="position: absolute; top: 5px; left: 7px; color: #94a3b8; font-size: 8px; text-transform: uppercase; letter-spacing: 0.8px; z-index: 2;">Instructor</div>
          <div style="flex: 1; display: flex; align-items: flex-end; justify-content: center;">
            <div style="display: flex; flex-direction: column; align-items: center; padding-bottom: 8px;">
              <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #cbd5e1, #94a3b8); border-radius: 50%; margin-bottom: 3px; border: 2px solid #e2e8f0;"></div>
              <div style="width: 50px; height: 58px; background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); border-radius: 7px 7px 0 0;"></div>
            </div>
          </div>
          <!-- Speaking indicator -->
          <div style="position: absolute; bottom: 6px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; align-items: flex-end; height: 12px;">
            <div style="width: 3px; height: 5px; background: #6366f1; border-radius: 1px; opacity: 0.4;"></div>
            <div style="width: 3px; height: 10px; background: #6366f1; border-radius: 1px; opacity: 0.8;"></div>
            <div style="width: 3px; height: 7px; background: #6366f1; border-radius: 1px; opacity: 0.6;"></div>
            <div style="width: 3px; height: 12px; background: #6366f1; border-radius: 1px;"></div>
            <div style="width: 3px; height: 6px; background: #6366f1; border-radius: 1px; opacity: 0.5;"></div>
          </div>
        </div>

        <!-- Student 50% -->
        <div style="height: 50%; background: #e9eef5; position: relative; overflow: hidden; display: flex; flex-direction: column;">
          <div style="position: absolute; top: 5px; left: 7px; color: #94a3b8; font-size: 8px; text-transform: uppercase; letter-spacing: 0.8px; z-index: 2;">Student</div>
          <div style="flex: 1; display: flex; align-items: flex-end; justify-content: center;">
            <div style="display: flex; flex-direction: column; align-items: center; padding-bottom: 8px;">
              <div style="width: 28px; height: 28px; background: linear-gradient(135deg, #94a3b8, #64748b); border-radius: 50%; margin-bottom: 3px; border: 1.5px solid #cbd5e1;"></div>
              <div style="width: 40px; height: 46px; background: linear-gradient(180deg, #64748b 0%, #475569 100%); border-radius: 7px 7px 0 0;"></div>
            </div>
          </div>
        </div>

      </div>

      <!-- RIGHT STRIP: Vertical buttons 6% -->
      <div style="width: 6%; background: #ffffff; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px 0;">

        <div title="提问" style="width: 28px; height: 28px; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer;">✋</div>

        <div title="静音" style="width: 28px; height: 28px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer;">🎤</div>

        <div title="摄像头" style="width: 28px; height: 28px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer;">📷</div>

        <div style="width: 20px; height: 1px; background: #e2e8f0;"></div>

        <div title="音量" style="width: 28px; height: 28px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer;">🔊</div>

        <div title="字幕" style="width: 28px; height: 28px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; color: #64748b; font-weight: bold;">CC</div>

        <div title="更多" style="width: 28px; height: 28px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; color: #94a3b8;">⋯</div>

      </div>

    </div>
  </div>

  <p style="text-align: center; color: #94a3b8; font-size: 10px; margin-top: 8px;">讲义 70% · 头像列 24% · 按钮条 6% · 无底栏</p>
</div>
